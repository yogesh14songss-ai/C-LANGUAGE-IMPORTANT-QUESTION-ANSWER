<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C Language Practice Problems - By Yogesh </title>
<link rel="stylesheet" href="prt.css">
</head>
<body>
    <div class="container">
        <div class="creator-badge">
            <h1>Created by Yogesh Parmar </h1>
            <h2>For c Language problem solving</h2>
        </div>

        
        <div id="topics-view">
            <div class="header">
                <h2>C Language Practice Problems</h2>
                <p>Select a topic to view questions</p>
            </div>
            <div class="topics-grid" id="topics-container"></div>
        </div>

        
        <div id="questions-view" class="hidden">
            <button class="back-button" onclick="showTopics()">← Back to Topics</button>
            <div class="header">
                <h2 id="topic-title"></h2>
            </div>
            <ul class="questions-list" id="questions-container"></ul>
        </div>

        
        <div id="answer-view" class="hidden">
            <button class="back-button" onclick="showQuestions()">← Back to Questions</button>
            <div class="answer-view">
                <h3>Question:</h3>
                <div class="question-text" id="question-display"></div>
                <h3>Answer: </h3>
                <div id="answer-display"></div>
                <h3>Output</h3>
                <section class="terminal-window" aria-label="C program output preview">
                    <div class="terminal-titlebar">
                        <div class="terminal-window-controls" aria-hidden="true">
                            <span class="terminal-control control-close"></span>
                            <span class="terminal-control control-minimize"></span>
                            <span class="terminal-control control-maximize"></span>
                        </div>
                        <div class="terminal-tab"><span class="terminal-tab-icon">&gt;_</span> TERMINAL</div>
                        <div class="terminal-toolbar">
                            <span class="terminal-output-label">OUTPUT</span>
                            <button id="copy-output-btn" class="copy-output-btn" type="button" onclick="copyOutputToClipboard()" title="Copy displayed output">Copy</button>
                        </div>
                    </div>
                    <pre id="output-display" class="output-text" aria-live="polite">Select a question to preview its console output.</pre>
                    <div class="terminal-statusbar">
                        <span class="terminal-status-left"><span class="status-indicator"></span> OUTPUT PREVIEW</span>
                        <span class="terminal-status-right">C · UTF-8 · LF</span>
                    </div>
                </section>
            </div>
        </div>
    </div>
<script src="prt.js"></script>    </body>
</html>
